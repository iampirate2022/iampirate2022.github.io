<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f4f1">
  <title>Welcome</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 32px 20px;
      background: #f4f4f1;
      color: #20211e;
      font-family: Georgia, "Times New Roman", serif;
    }
    main { width: min(100%, 900px); margin: 8vh auto 0; }
    h1 { margin: 0 0 24px; font-size: 32px; font-weight: 400; }
    video {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #171815;
      object-fit: contain;
    }
    .white-screen {
      position: fixed;
      z-index: 2;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
    }
    body.entered main { opacity: 0; pointer-events: none; }
    body.entered .white-screen { opacity: 1; }
    #status { margin: 12px 0 0; color: #66675f; font: 14px Arial, sans-serif; }
    [hidden] { display: none; }
    @media (max-width: 520px) {
      body { padding: 20px 14px; }
      main { margin-top: 5vh; }
      h1 { margin-bottom: 18px; font-size: 28px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Welcome</h1>
    <video id="video" controls loop playsinline preload="metadata">
      <source src="video-compatible.webm" type='video/webm; codecs="vp8, vorbis"'>
      <source src="video.mp4" type='video/mp4; codecs="avc1.4D401F, mp4a.40.2"'>
    </video>
    <p id="status" role="status" aria-live="polite" hidden></p>
  </main>
  <div class="white-screen" aria-hidden="true"></div>

  <script>
    const video = document.querySelector("#video");
    const status = document.querySelector("#status");

    video.addEventListener("error", () => {
      status.textContent = "The video could not be loaded. Check the video file and format.";
      status.hidden = false;
    });

    video.addEventListener("play", () => {
      document.body.classList.add("entered");
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && document.body.classList.contains("entered")) {
        document.body.classList.remove("entered");
        video.pause();
      }
    });
  </script>
</body>
</html>
